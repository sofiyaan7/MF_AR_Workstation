# MF AR Workstation — full stack.
#
#   cp .env.example .env      # then edit the secrets
#   docker compose up --build
#
# The portal is served at http://localhost:8080
name: mf-ar-workstation

services:
  postgres:
    image: postgres:16-alpine
    container_name: mfar-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-portal}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}
      POSTGRES_DB: ${POSTGRES_DB:-mf_ar_workstation}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      # Exposed on loopback only, for psql access from the host.
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-portal} -d ${POSTGRES_DB:-mf_ar_workstation}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  backend:
    build:
      context: ./backend
    container_name: mfar-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER:-portal}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-mf_ar_workstation}
      SECRET_KEY: ${SECRET_KEY:?SECRET_KEY must be set in .env}
      ENVIRONMENT: ${ENVIRONMENT:-production}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-30}
      REFRESH_TOKEN_EXPIRE_DAYS: ${REFRESH_TOKEN_EXPIRE_DAYS:-7}
      SESSION_IDLE_TIMEOUT_MINUTES: ${SESSION_IDLE_TIMEOUT_MINUTES:-480}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      COOKIE_SAMESITE: ${COOKIE_SAMESITE:-lax}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:8080}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:8080}
      MAX_FAILED_LOGIN_ATTEMPTS: ${MAX_FAILED_LOGIN_ATTEMPTS:-5}
      ACCOUNT_LOCKOUT_MINUTES: ${ACCOUNT_LOCKOUT_MINUTES:-15}
      PASSWORD_MIN_LENGTH: ${PASSWORD_MIN_LENGTH:-12}
      # First-run bootstrap. Leave FIRST_ADMIN_PASSWORD unset to have a strong
      # one generated and printed once in the backend logs.
      RUN_SEED: ${RUN_SEED:-true}
      SEED_DEMO_DATA: ${SEED_DEMO_DATA:-false}
      FIRST_ADMIN_EMPLOYEE_ID: ${FIRST_ADMIN_EMPLOYEE_ID:-ADMIN001}
      FIRST_ADMIN_NAME: ${FIRST_ADMIN_NAME:-System Administrator}
      FIRST_ADMIN_EMAIL: ${FIRST_ADMIN_EMAIL:-admin@example.com}
      FIRST_ADMIN_PASSWORD: ${FIRST_ADMIN_PASSWORD:-}
    ports:
      - "127.0.0.1:${BACKEND_PORT:-8000}:8000"

  frontend:
    build:
      context: ./frontend
    container_name: mfar-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "${FRONTEND_PORT:-8080}:80"

volumes:
  postgres_data:
    driver: local
